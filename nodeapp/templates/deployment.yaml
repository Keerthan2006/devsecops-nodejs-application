apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp-deploy
  namespace: application
  labels:
    app: node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      containers:
      - name: nodeContainer
        image: "{{ .Values.image.user }}/nodeapp:{{ .Values.image.tag }}"
        ports:
        - containerPort: 80
